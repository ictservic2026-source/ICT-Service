<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ตั้งรหัสผ่านใหม่ | ICT Service Desk</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/reset-password.css">

</head>

<body>

  <main class="reset-card">

    <div class="reset-mark">
      ICT
    </div>

    <h1>
      ตั้งรหัสผ่านใหม่
    </h1>

    <p class="reset-sub">
      ICT Service Desk · NISSEI TRADING (THAILAND)
    </p>

    <p class="reset-description">
      กรุณากำหนดรหัสผ่านใหม่สำหรับบัญชีเจ้าหน้าที่ IT
    </p>

    <form id="resetPasswordForm">

      <label for="newPassword">
        รหัสผ่านใหม่
      </label>

      <input
        id="newPassword"
        type="password"
        autocomplete="new-password"
        minlength="8"
        placeholder="อย่างน้อย 8 ตัวอักษร"
        required
      >

      <label for="confirmPassword">
        ยืนยันรหัสผ่านใหม่
      </label>

      <input
        id="confirmPassword"
        type="password"
        autocomplete="new-password"
        minlength="8"
        placeholder="กรอกรหัสผ่านอีกครั้ง"
        required
      >

      <button
        class="reset-btn"
        id="resetButton"
        type="submit"
      >
        เปลี่ยนรหัสผ่าน
      </button>

      <div
        class="reset-message"
        id="resetMessage"
        role="alert"
      ></div>

    </form>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/reset-password.js"></script>

</body>

</html>
