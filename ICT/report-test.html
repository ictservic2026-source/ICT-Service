<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Test | ICT Service Desk</title>

    <link rel="stylesheet" href="css/report-test.css">
</head>

<body>

<div class="container">

    <div class="header">
        <div>
            <h1>ICT Service Desk</h1>
            <p>Monthly Report Test</p>
        </div>
    </div>

    <!-- FILTER -->
    <section class="filter-card">

        <div class="filter-group">

            <label for="reportMonth">
                เดือนที่ต้องการดึง
            </label>

            <input
                type="month"
                id="reportMonth"
            >

        </div>

        <button
            id="loadReportBtn"
            class="btn-primary"
        >
            🔍 ดึงข้อมูล
        </button>

    </section>


    <!-- SUMMARY -->
    <section
        id="summary"
        class="summary-grid"
    >

        <div class="summary-card">
            <span>Ticket ทั้งหมด</span>
            <strong id="totalTickets">0</strong>
        </div>

        <div class="summary-card">
            <span>รูปภาพทั้งหมด</span>
            <strong id="totalImages">0</strong>
        </div>

        <div class="summary-card">
            <span>เอกสารทั้งหมด</span>
            <strong id="totalAttachments">0</strong>
        </div>

        <div class="summary-card">
            <span>Service</span>
            <strong id="totalServices">0</strong>
        </div>

    </section>


    <!-- STATUS -->
    <div
        id="statusMessage"
        class="status-message"
    >
        เลือกเดือน แล้วกด "ดึงข้อมูล"
    </div>


    <!-- RESULT -->
    <section id="resultContainer">

    </section>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/report-test.js"></script>

</body>
</html>
