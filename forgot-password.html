<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ลืมรหัสผ่าน | ICT Service Desk</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/forgot-password.css">
</head>

<body>

  <main class="forgot-card">

    <div class="forgot-mark">ICT</div>

    <h1>ลืมรหัสผ่าน</h1>

    <p class="forgot-sub">
      ICT Service Desk · NISSEI TRADING (THAILAND)
    </p>

    <p class="forgot-description">
      กรอกอีเมลของเจ้าหน้าที่ที่ใช้เข้าสู่ระบบ
      ระบบจะส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ไปให้
    </p>

    <form id="forgotPasswordForm">

      <label for="forgotEmail">
        อีเมล
      </label>

      <input
        id="forgotEmail"
        type="email"
        autocomplete="email"
        placeholder="example@nissei.co.th"
        required
      >

      <button
        class="forgot-btn"
        id="forgotButton"
        type="submit"
      >
        ส่งลิงก์เปลี่ยนรหัสผ่าน
      </button>

      <div
        class="forgot-message"
        id="forgotMessage"
        role="alert"
      ></div>

    </form>

    <div class="back-login">
      <a href="login.html">
        ← กลับหน้าเข้าสู่ระบบ
      </a>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/forgot-password.js"></script>

</body>
</html>
